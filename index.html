  if (planActive) { calcularViagens(true); return; }
  render();
});

// ───────── Render ─────────
function referencia() { return originLL || destLL; }

function render() {
  if (tab === 'lin') { renderLinhas(); return; }
  if (tab === 'rec') { renderRecorrentes(); return; }
  if (planActive) { renderTrips(); return; }
  tripLayer.clearLayers();
  updatePanelSum();
  var ref = referencia();
  var list = $('bus-list'), chips = $('chips');

  buses.forEach(function(b) { b._d = ref ? hav(ref.lat, ref.lng, b.lat, b.lng) : null; });

  var visiveis;
  if (filterLines.length) visiveis = buses.filter(function(b) { return filterLines.indexOf(normLine(b.s)) >= 0; });
  else if (ref) visiveis = buses.filter(function(b) { return b._d <= RAIO_PERTO_KM; });
  else visiveis = [];

  visiveis.sort(function(a, c) { return (a._d === null ? 0 : a._d) - (c._d === null ? 0 : c._d); });

  // Linhas que passam perto (chips)
  chips.hidden = true;
  if (ref && !filterLines.length) {
    var perto = {}, pertoB = {};
    buses.forEach(function(b) {
      if (b._d !== null && b._d <= 0.8) { if (!(b.s in perto) || b._d < perto[b.s]) perto[b.s] = b._d; }
      if (destLL && originLL && hav(destLL.lat, destLL.lng, b.lat, b.lng) <= 0.8) pertoB[b.s] = true;
    });
    var ls = Object.keys(perto).sort(function(x, y) { return perto[x] - perto[y]; }).slice(0, 14);
    if (ls.length) {
      chips.hidden = false;
      chips.innerHTML = '<div class="chips-label">Linhas com ônibus a até 800 m de ' + (originLL ? 'A' : 'B')
        + (destLL && originLL ? ' · <span style="color:var(--green)">verde = também há ônibus perto de B (estimativa)</span>' : '') + ' — toque para filtrar</div>';
      ls.forEach(function(s) {
        var c = document.createElement('span');
        c.className = 'chip' + (pertoB[s] ? ' both' : '');
        c.textContent = s;
        c.addEventListener('click', function() { $('line-input').value = s; filterLines = [normLine(s)]; render(); });
        chips.appendChild(c);
      });
    }
  }

  // Marcadores
  busLayer.clearLayers();
  visiveis.slice(0, MAX_MARKERS).forEach(function(b, i) {
    var near = ref && i === 0;
    var mk = L.marker([b.lat, b.lng], { icon: mkIcon('<div class="bmarker' + (b.m === 'B' ? ' brt' : '') + (near ? ' nearest-bus' : '') + '">' + esc(b.s) + '</div>', 40, 24), zIndexOffset: near ? 900 : 500 });
    var age = ageMin(b.t);
    mk.bindPopup('<b>Linha ' + esc(b.s) + '</b> · ' + esc(b.id) + '<br>' + b.v + ' km/h' + (age !== null ? '<br>posição de ' + age + ' min atrás' : ''));
    busLayer.addLayer(mk);
  });

  $('counter').textContent = (filterLines.length || ref) ? visiveis.length + ' ônibus' : buses.length + ' no Rio';
  $('panel-title').textContent = filterLines.length ? 'Linha ' + filterLines.join(', ') : 'Ônibus mais próximos';

  // Lista
  if (!buses.length) { list.innerHTML = '<div class="empty">Aguardando dados dos ônibus...</div>'; return; }
  if (!filterLines.length && !ref) { list.innerHTML = '<div class="empty">Defina a origem (GPS, endereço ou toque no mapa) para ver os ônibus perto de você, ou digite uma linha no filtro.</div>'; return; }
  if (!visiveis.length) {
    list.innerHTML = '<div class="empty">' + (filterLines.length ? 'Nenhum ônibus em circulação nessa linha agora.' : 'Nenhum ônibus a até ' + RAIO_PERTO_KM + ' km de você agora.') + '</div>';
    return;
  }
  var html = '';
  visiveis.slice(0, 12).forEach(function(b, i) {
    var dTxt = b._d !== null ? fmtDist(b._d) : '';
    var prev = prevPos[b.id], approach = false, away = false;
    if (b._d !== null && prev && ref) {
      var pd = hav(ref.lat, ref.lng, prev.lat, prev.lng);
      approach = b._d < pd - 0.03; away = b._d > pd + 0.03;
    }
    var eta = (approach && b.v >= 3 && b._d !== null) ? ' · ~' + Math.max(1, Math.round(b._d / b.v * 60)) + ' min' : '';
    var dir = approach ? 'Aproximando' + eta : (away ? 'Afastando' : (b.d === 'I' ? 'Sentido ida' : b.d === 'V' ? 'Sentido volta' : 'Em circulação'));
    var badge = approach ? '<span class="badge b-aprox">aprox.</span>' : (away ? '<span class="badge b-longe">afastando</span>' : '');
    var age = ageMin(b.t);
    html += '<div class="brow' + (i === 0 && ref ? ' nearest' : '') + '">'
      + '<div><div class="bline">' + esc(b.s) + '</div><div class="bid">' + esc(b.id) + '</div></div>'
      + '<div><div class="bdist">' + esc(dTxt) + ' ' + badge + '</div><div class="bdir">' + esc(dir) + '</div></div>'
      + '<div><div class="bspd">' + b.v + ' km/h</div><div class="bage">' + (age !== null ? age + ' min' : '') + '</div></div>'
      + '</div>';
  });
  list.innerHTML = html;
}

// ───────── Dados ─────────
function showFreshness() {
  if (!dataUpdated) return;
  var t = rioMs(dataUpdated), min = isNaN(t) ? null : Math.round((Date.now() - t) / 60000);
  var hora = String(dataUpdated).slice(11, 16);
  var cls = min === null ? 'wait' : (min <= 12 ? 'live' : (min <= 30 ? 'wait' : 'err'));
  setStatus(cls, 'Aê, Piloto', 'Dados de ' + hora + (min !== null ? ' (há ' + min + ' min)' : '') + ' · SMTR/Rio');
}

// 1ª opção: Worker do Cloudflare (repassa a SMTR com CORS e cache de 30 s; o celular consolida). Reserva: gps.json do GitHub Actions.
function buscarSppo(forcar) {
  var t = forcar ? Date.now() : Math.floor(Date.now() / 30000);
  var doWorker = WORKER_URL
    ? fetch(WORKER_URL + (WORKER_URL.indexOf('?') < 0 ? '?' : '&') + 't=' + t, { cache: 'no-store' })
        .then(function(r) { if (!r.ok) throw new Error('worker ' + r.status); return r.json(); })
        .then(function(arr) { if (!Array.isArray(arr) || arr.length < 100) throw new Error('worker sem dados'); return Planner.consolidar(arr); })
    : Promise.reject(new Error('sem worker'));
  return doWorker.catch(function() {
    return fetch(DATA_URL + '?t=' + (forcar ? Date.now() : Math.floor(Date.now() / 60000)), { cache: 'no-store' })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  });
}

// BRT: opcional; se falhar, segue só com os ônibus
function buscarBrt() {
  if (!WORKER_URL) return Promise.resolve([]);
  return fetch(WORKER_URL.replace(/\/+$/, '') + '/brt?t=' + Math.floor(Date.now() / 30000), { cache: 'no-store' })
    .then(function(r) { if (!r.ok) throw new Error('brt ' + r.status); return r.json(); })
    .then(function(j) { return Planner.consolidarBRT(j, Date.now()); })
    .catch(function() { return []; });
}

function buscarDados(forcar) {
  return Promise.all([buscarSppo(forcar), buscarBrt()]).then(function(r) {
    var j = r[0];
    if (r[1].length) j = Object.assign({}, j, { buses: (j.buses || []).concat(r[1]) });
    return j;
  });
}

function carregar(forcar) {
  return buscarDados(forcar)
    .then(function(j) {
      var anterior = {};
      buses.forEach(function(b) { anterior[b.id] = { lat: b.lat, lng: b.lng }; });
      prevPos = anterior;
      buses = (j.buses || []).map(function(a) { return { s:String(a[0]), id:String(a[1]), lat:a[2], lng:a[3], v:a[4] || 0, d:a[5], t:a[6], m:a[7] || '' }; });
      dataUpdated = j.updated;
      if (apiErrorState) { apiErrorState = false; showToast('✅ Dados atualizados', 'ok', 2500); }
      showFreshness();
      if (tab === 'lin') renderLinhas(); else if (tab === 'rec') renderRecorrentes(); else if (planActive) calcularViagens(); else render();
    })
    .catch(function(e) {
      var msg;
      if (!navigator.onLine) msg = '📶 Sem internet no aparelho. Atualiza sozinho quando voltar.';
      else if (String(e.message).indexOf('404') >= 0) msg = '⏳ Dados ainda não publicados. O primeiro ciclo leva até 10 min.';
      else msg = '⚠️ Não foi possível carregar os dados (' + e.message + '). Nova tentativa em 1 min.';
      setStatus('err', null, msg.replace(/^\S+\s/, ''));
      if (!apiErrorState) { apiErrorState = true; showToast(msg, 'error', 6000); }
    });
}

carregar();
setInterval(carregar, REFRESH);
window.addEventListener('online', carregar);

// ───────── Aba Encontro — rastreamento por código ─────────
function meuPid() {

    if (!p) { p = Math.random().toString(36).slice(2,10).toUpperCase(); localStorage.setItem(KEY, p); }

function iniciarSessao() {
  fetch(WORKER_URL + 'sessao/criar', {method:'POST'})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error === 'kv_nao_configurado') { showToast('Função ainda não ativada (KV pendente)', 'warn', 5000); return; }
      if (!d.codigo) { showToast('Erro ao criar sessão', 'error', 3000); return; }
      sessaoCodigo = d.codigo; sessaoPid = meuPid(); sessaoAtiva = true;
      encontroLayer.clearLayers(); renderEncontro(); iniciarShare(); iniciarPoll();
    }).catch(function() { showToast('Sem conexão com o servidor', 'error', 4000); });
}

function entrarSessao(cod) {
  if (!cod || cod.length < 4) { showToast('Digite o código (4–5 caracteres)', 'warn', 3000); return; }
  sessaoCodigo = cod; sessaoPid = meuPid(); sessaoAtiva = true;
  encontroLayer.clearLayers(); renderEncontro(); iniciarShare(); iniciarPoll();
}

function encerrarSessao(motivo) {
  clearInterval(_pollH); clearInterval(_shareH); clearTimeout(_expiryH);
  sessaoAtiva = false; sessaoCodigo = null; _proximoSince = null; _minhaPos = null;
  encontroLayer.clearLayers(); renderEncontro();
  if (motivo) showToast(motivo, 'ok', 4000);
}

function distM2(a, b) {
  var R = 6371000, dLat = (b.lat - a.lat) * Math.PI / 180, dLon = (b.lng - a.lng) * Math.PI / 180;
  var s = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function iniciarShare() {
  clearInterval(_shareH);
  function enviar() {
    if (!sessaoAtiva || !navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function(pos) {
      _minhaPos = {lat: pos.coords.latitude, lng: pos.coords.longitude};
      fetch(WORKER_URL + 'sessao/' + sessaoCodigo + '/' + sessaoPid, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({lat: _minhaPos.lat, lng: _minhaPos.lng, nome: 'Eu'})
      }).catch(function(){});
    }, function(){}, {enableHighAccuracy:false, timeout:10000, maximumAge:20000});
  }
  enviar(); _shareH = setInterval(enviar, 30000);
}

function iniciarPoll() {
  clearInterval(_pollH);
  function buscar() {
    if (!sessaoAtiva) return;
    fetch(WORKER_URL + 'sessao/' + sessaoCodigo)
      .then(function(r) { return r.json(); })
      .then(function(ps) {
        if (!Array.isArray(ps)) return;
        encontroLayer.clearLayers();
        var meu = sessaoPid, outros = ps.filter(function(p) { return p.pid !== meu; });

        // Marcadores dos participantes no mapa
        outros.forEach(function(p) {
          var lbl = '<div class="bmarker" style="background:var(--amber);color:#000">👤 ' + esc(p.nome || '?') + '</div>';
          encontroLayer.addLayer(L.marker([p.lat, p.lng], {
            icon: mkIcon(lbl, 80, 24), zIndexOffset: 1000
          }).bindTooltip((p.nome || 'Participante') + ' · ' + Math.round((Date.now() - p.ts) / 1000) + 's atrás'));
        });

        // Detecção de proximidade → expiração automática
        var perto = outros.length && _minhaPos && outros.some(function(p) {
          return distM2(_minhaPos, {lat: p.lat, lng: p.lng}) <= PROX_M;
        });

        if (perto) {
          if (!_proximoSince) {
            _proximoSince = Date.now();
            _expiryH = setTimeout(function() {
              encerrarSessao('🤝 Vocês se encontraram! Sessão encerrada.');
            }, EXPIRY_MS);
          }
        } else {
          if (_proximoSince) { _proximoSince = null; clearTimeout(_expiryH); _expiryH = null; }
        }

        // Atualiza status na tela
        var st = $('enc-st');
        if (st) {
          var txt, cls = 'enc-status';
          if (perto && _proximoSince) {
            var restante = Math.max(0, Math.round((EXPIRY_MS - (Date.now() - _proximoSince)) / 60000));
            txt = '🤝 Próximos! Sessão expira em ' + restante + ' min';
            cls += ' ok';
          } else if (outros.length) {
            txt = outros.length + ' participante' + (outros.length > 1 ? 's' : '') + ' no mapa';
            cls += ' ok';
          } else {
            txt = 'Aguardando participantes…';
          }
          st.textContent = txt; st.className = cls;
        }
      }).catch(function(){});
  }
  buscar(); _pollH = setInterval(buscar, 15000);
}

// ───────── Histórico de saídas (estimativa de saída — fase 1: coleta local) ─────────
var histSaida = (function() {
  var KEY = 'ae.hist';
  function ler() { try { var d = JSON.parse(localStorage.getItem(KEY)); return d || {viagens:[], settings:{coleta_ativa:true}}; } catch(e) { return {viagens:[], settings:{coleta_ativa:true}}; } }
  function gravar(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {} }
  var sem = function(s) { return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim(); };
  return {
    ativo: function() { return ler().settings.coleta_ativa !== false; },
    setAtivo: function(v) { var d = ler(); d.settings.coleta_ativa = v; gravar(d); },
    registrar: function(trip, nomOrigem, nomDestino) {
      var d = ler();
      d.viagens.push({ data: new Date().toISOString(), linhaId: trip.svc, paradaSaida: trip.stopA, paradaDest: trip.stopB, tempoTotal: trip.total, horaSaida: hhmm(new Date()), origem: nomOrigem, destino: nomDestino });
      if (d.viagens.length > 200) d.viagens = d.viagens.slice(-200);
      gravar(d);
    },
    resumo: function(nomOrigem, nomDestino) {
      var d = ler();
      var orig = sem(nomOrigem), dest = sem(nomDestino);
      if (!orig || !dest) return null;
      var vs = d.viagens.filter(function(v) { return sem(v.origem) === orig && sem(v.destino) === dest; });
      if (!vs.length) return null;
      var ultima = vs[vs.length - 1];
      var tempos = vs.map(function(v) { return v.tempoTotal||0; }).filter(function(t) { return t > 0; });
      var med = tempos.length ? Math.round(tempos.reduce(function(a,b){return a+b;},0)/tempos.length) : null;
      return { ultimaSaida: ultima.horaSaida, tempoMedio: med, count: vs.length };
    }
  };
})();

// ───────── Tema: automático / claro / escuro (lembrado neste aparelho) ─────────
(function() {
  var KEY = 'onibus.tema', raiz = document.documentElement, menu = document.getElementById('menu-tema'), btn = document.getElementById('btn-tema');
  function ler() { try { return localStorage.getItem(KEY) || 'auto'; } catch (e) { return 'auto'; } }
  function aplicar(m) {
    if (m === 'light' || m === 'dark') raiz.setAttribute('data-theme', m); else raiz.removeAttribute('data-theme');
    [].forEach.call(menu.querySelectorAll('button'), function(b) { b.classList.toggle('on', b.getAttribute('data-tema') === m); });
    var escuro = m === 'dark' || (m !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    var meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.setAttribute('content', escuro ? '#000000' : '#f2f2f7');
  }
  btn.addEventListener('click', function(e) { e.stopPropagation(); menu.hidden = !menu.hidden; });
  document.addEventListener('click', function(e) { if (!menu.hidden && !menu.contains(e.target)) menu.hidden = true; });
  menu.addEventListener('click', function(e) {
    var b = e.target.closest('button'); if (!b) return;
    var m = b.getAttribute('data-tema'); try { localStorage.setItem(KEY, m); } catch (x) {}
    aplicar(m); menu.hidden = true;
  });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() { aplicar(ler()); });
  aplicar(ler());
  var v = document.getElementById('app-versao'); if (v) v.textContent = APP_V;
  // Registro do Service Worker (PWA)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    });
  }
  var btnReg = document.getElementById('btn-registrar');
  if (btnReg) {
    function aplicarReg() { btnReg.classList.toggle('on', histSaida.ativo()); }
    btnReg.addEventListener('click', function() { histSaida.setAtivo(!histSaida.ativo()); aplicarReg(); });
    aplicarReg();
  }
})();
</script>
