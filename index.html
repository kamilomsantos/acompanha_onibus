<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ônibus Rio ao Vivo</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root {
  --bg:#0F172A; --surf:#1E293B; --surf2:#263448; --fg:#E2E8F0; --muted:#64748B; --border:#334155;
  --yellow:#F59E0B; --ydim:rgba(245,158,11,.15); --green:#22C55E; --gdim:rgba(34,197,94,.15);
  --blue:#38BDF8; --red:#F87171;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
[hidden] { display:none !important; }
html, body { height:100%; background:var(--bg); color:var(--fg); font-family:'Inter',system-ui,sans-serif; overflow:hidden; }
body { display:flex; flex-direction:column; }

.topbar { background:var(--surf); border-bottom:1px solid var(--border); padding:9px 14px; display:flex; align-items:center; gap:10px; flex-shrink:0; z-index:1000; }
.logo { background:var(--yellow); color:#000; font-size:.7rem; font-weight:800; padding:5px 8px; border-radius:7px; letter-spacing:.06em; flex-shrink:0; }
.topbar-info { flex:1; min-width:0; }
.topbar-title { font-size:.85rem; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar-sub { font-size:.64rem; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
.dot.live { background:var(--green); animation:pulse 1.5s infinite; }
.dot.wait { background:var(--yellow); }
.dot.err  { background:var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
#counter { font-family:'JetBrains Mono',monospace; font-size:.8rem; font-weight:600; color:var(--yellow); flex-shrink:0; }

.search-bar { background:var(--surf); border-bottom:1px solid var(--border); padding:8px 12px; display:flex; flex-direction:column; gap:6px; flex-shrink:0; z-index:999; }
.search-row { display:flex; gap:6px; align-items:center; position:relative; }
.field-wrap { flex:1; position:relative; min-width:0; }
.search-bar input { width:100%; background:var(--surf2); border:1px solid var(--border); color:var(--fg); border-radius:8px; padding:8px 10px 8px 42px; font-size:.82rem; font-family:'Inter',sans-serif; outline:none; transition:border-color .2s; }
.search-bar input:focus { border-color:var(--blue); }
.search-bar input::placeholder { color:var(--muted); font-size:.76rem; }
.field-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; pointer-events:none; z-index:1; }
.field-icon.orig { background:var(--blue); color:#000; }
.field-icon.dest { background:var(--red); color:#fff; }
.field-icon.line { background:var(--yellow); color:#000; font-size:.6rem; }

.ac-drop { position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--surf); border:1px solid var(--border); border-radius:10px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.5); z-index:2000; max-height:220px; display:none; }
.ac-drop.open { display:block; }
.ac-item { padding:9px 12px; cursor:pointer; font-size:.78rem; line-height:1.4; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:flex-start; }
.ac-item:last-child { border-bottom:none; }
.ac-item:hover, .ac-item.active { background:var(--surf2); }
.ac-icon { font-size:.9rem; flex-shrink:0; margin-top:1px; }
.ac-main { font-weight:600; }
.ac-sub { font-size:.68rem; color:var(--muted); margin-top:1px; }
.ac-msg { padding:10px 12px; font-size:.75rem; color:var(--muted); text-align:center; }

.btn-gps { background:none; border:1px solid var(--border); color:var(--blue); border-radius:7px; padding:6px 9px; font-size:.7rem; font-weight:600; cursor:pointer; white-space:nowrap; font-family:'Inter',sans-serif; flex-shrink:0; }
.btn-gps:hover { background:var(--surf2); }
.btn-ir { background:var(--yellow); color:#000; border:none; border-radius:8px; padding:8px 12px; font-size:.78rem; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; flex-shrink:0; }
.btn-ir:hover { background:#d97706; }

#map { flex:1; min-height:0; }

.toast { position:fixed; bottom:38vh; left:50%; transform:translateX(-50%); background:#1e293b; border:1px solid var(--border); color:var(--fg); border-radius:10px; padding:10px 16px; font-size:.78rem; max-width:90vw; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.6); z-index:3000; opacity:0; pointer-events:none; transition:opacity .25s; }
.toast.show { opacity:1; }
.toast.warn  { border-color:var(--yellow); color:var(--yellow); }
.toast.error { border-color:var(--red); color:var(--red); }
.toast.ok    { border-color:var(--green); color:var(--green); }

.panel { background:var(--surf); border-top:1px solid var(--border); flex-shrink:0; overflow-y:auto; max-height:34vh; }
.panel-head { padding:7px 14px; background:var(--surf2); font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px; position:sticky; top:0; z-index:1; border-bottom:1px solid var(--border); }
.gm-link { font-size:.6rem; padding:3px 7px; text-decoration:none; color:var(--blue); border:1px solid var(--border); border-radius:6px; letter-spacing:.02em; text-transform:none; }

.chips { padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--border); align-items:center; }
.chips-label { font-size:.62rem; color:var(--muted); width:100%; }
.chip { background:var(--surf2); border:1px solid var(--border); color:var(--yellow); border-radius:14px; padding:3px 9px; font-family:'JetBrains Mono',monospace; font-size:.74rem; font-weight:600; cursor:pointer; }
.chip.both { border-color:var(--green); color:var(--green); }
.chip:hover { background:var(--border); }

.brow { padding:9px 14px; display:grid; grid-template-columns:58px 1fr auto; gap:8px; align-items:center; border-bottom:1px solid var(--border); }
.brow:last-child { border-bottom:none; }
.brow.nearest { background:var(--gdim); }
.bline { font-family:'JetBrains Mono',monospace; font-size:.86rem; font-weight:700; color:var(--yellow); }
.bid { font-family:'JetBrains Mono',monospace; font-size:.58rem; color:var(--muted); margin-top:2px; }
.bdist { font-size:.82rem; font-weight:700; }
.bdir { font-size:.65rem; color:var(--muted); margin-top:2px; }
.bspd { font-family:'JetBrains Mono',monospace; font-size:.76rem; color:var(--muted); text-align:right; }
.bage { font-family:'JetBrains Mono',monospace; font-size:.6rem; color:var(--muted); text-align:right; }
.badge { font-size:.56rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 5px; border-radius:4px; }
.b-aprox { background:var(--gdim); color:var(--green); }
.b-longe { background:var(--ydim); color:var(--yellow); }
.empty { padding:16px; text-align:center; font-size:.78rem; color:var(--muted); line-height:1.6; }

.trip { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
.trip:last-child { border-bottom:none; }
.trip:hover { background:var(--surf2); }
.trip.sel { background:var(--gdim); box-shadow:inset 3px 0 0 var(--green); }
.trip-top { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.tline { font-family:'JetBrains Mono',monospace; font-size:.9rem; font-weight:800; background:var(--yellow); color:#000; padding:1px 8px; border-radius:6px; }
.thead { font-size:.74rem; color:var(--muted); flex:1; min-width:0; }
.ttot { font-size:.78rem; text-align:right; }
.ttot b { font-size:.95rem; }
.tsub { font-size:.72rem; color:var(--muted); margin-top:4px; line-height:1.45; }
.tsub b { color:var(--green); }
.tnote { padding:7px 14px; font-size:.62rem; color:var(--muted); border-bottom:1px solid var(--border); line-height:1.4; }
#side { display:contents; }
.topbar { order:1; } .search-bar { order:2; } #map { order:3; } .tabs { order:4; } .panel { order:5; }
.tabs { display:flex; background:var(--surf); border-top:1px solid var(--border); flex-shrink:0; z-index:5; }
.tabs button { flex:1; background:none; border:none; border-bottom:3px solid transparent; color:var(--muted); font-family:'Inter',sans-serif; font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:10px 0 8px; cursor:pointer; }
.tabs button.on { color:var(--yellow); border-bottom-color:var(--yellow); }
.tsec { padding:8px 14px 4px; font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--yellow); }
.tgroup { padding:8px 14px 6px; display:flex; justify-content:space-between; gap:8px; align-items:baseline; background:var(--surf2); border-top:1px solid var(--border); }
.tstop { font-size:.78rem; font-weight:700; min-width:0; }
.twalk { font-size:.66rem; color:var(--muted); white-space:nowrap; }
.tsep { display:flex; align-items:center; gap:8px; padding:0 14px; font-size:.64rem; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
.tsep::before, .tsep::after { content:''; flex:1; height:1px; background:var(--border); }
.tgroup + .trip, .tsep + .trip { border-bottom:none; }
.search-bar input { padding-right:36px; }
.fav-btn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); font-size:1.15rem; line-height:1; cursor:pointer; padding:4px 7px; z-index:2; }
.fav-btn.on { color:var(--yellow); }
.ac-x { margin-left:auto; padding:0 6px; color:var(--muted); font-size:1rem; line-height:1; }
.ac-x:hover { color:var(--red); }
.ac-head { padding:6px 12px 2px; font-size:.6rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--yellow); }
.rrow { padding:12px 14px; border-bottom:1px solid var(--border); cursor:pointer; display:flex; align-items:center; gap:10px; }
.rrow:hover { background:var(--surf2); }
.rr-txt { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
.rr-line { display:flex; align-items:center; gap:8px; font-size:.8rem; min-width:0; }
.rr-nome { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.rr-dot { width:18px; height:18px; border-radius:50%; font-size:.6rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tsec.ok { color:var(--green); }
.tgroup.ponto { box-shadow:inset 3px 0 0 var(--green); }
.stopcnt { width:22px; height:22px; border-radius:50%; background:#64748B; color:#fff; border:2px solid #fff; font-family:'JetBrains Mono',monospace; font-size:.62rem; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.6); }
.stopcnt.perto { background:var(--green); color:#000; }
.lrow .badge { align-self:center; }
.lin-loc { display:none; align-items:center; gap:10px; }
.lin-loc span { font-size:.66rem; color:var(--muted); line-height:1.35; min-width:0; }
.search-bar.modo-lin .search-row, .search-bar.modo-lin .search-top { display:none; }
.search-bar.modo-lin .lin-loc { display:flex; }
.lsent { color:var(--fg); }
.lsent b { font-weight:700; }
.lrow { padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
.lrow:last-child { border-bottom:none; }
.lrow:hover { background:var(--surf2); }
.lrow.sel { background:var(--gdim); box-shadow:inset 3px 0 0 var(--green); }
.lrow .trip-top .ttot { color:var(--green); font-weight:700; font-size:.82rem; }
.lrow .ttot.off { color:var(--muted); font-weight:400; font-size:.7rem; }
@media (min-width:800px) {
  body { flex-direction:row; }
  #side { display:flex; flex-direction:column; width:400px; flex-shrink:0; height:100%; border-right:1px solid var(--border); background:var(--surf); }
  .topbar, .search-bar, #map, .tabs, .panel { order:0; }
  .tabs { border-top:none; border-bottom:1px solid var(--border); }
  .panel { flex:1; min-height:0; max-height:none; border-top:none; }
  #map { flex:1; height:100%; }
  .toast { bottom:24px; left:calc(50% + 200px); }
}
.pt { background:none; border:none; color:var(--blue); font-size:.95rem; cursor:pointer; padding:0 8px 0 0; line-height:1; transition:transform .2s; user-select:none; }
.panel.min .pt { transform:rotate(180deg); }
.panel-head { cursor:pointer; }
#panel-title { flex:1; min-width:0; }
#panel-sum { display:none; flex:1; min-width:0; text-transform:none; letter-spacing:0; color:var(--fg); font-size:.72rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.panel.min.has-sum #panel-sum { display:block; }
.panel.min.has-sum #panel-title { display:none; }
.panel.min { overflow:hidden; }
.panel.min #panel-body { display:none; }
.search-top { display:flex; align-items:center; gap:6px; cursor:pointer; font-size:.64rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; font-weight:700; }
.search-top #search-sum { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.search-top .pt { padding:0 2px 0 0; }
.search-bar.min .search-row { display:none; }
.search-bar.min .search-top .pt { transform:rotate(180deg); }
.waitmk { min-width:26px; height:24px; padding:0 8px; border-radius:11px; background:var(--green); color:#000; border:2px solid #fff; font-family:'JetBrains Mono',monospace; font-size:.62rem; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.6); white-space:nowrap; }
.stopmk { width:14px; height:14px; border-radius:50%; border:3px solid #fff; box-shadow:0 1px 6px rgba(0,0,0,.6); }
.bmarker { min-width:34px; height:24px; padding:0 5px; border-radius:12px; background:var(--yellow); border:2px solid #000; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:.64rem; font-weight:700; color:#000; box-shadow:0 2px 8px rgba(0,0,0,.6); white-space:nowrap; }
.tline.brt { background:#2f81f7; color:#fff; }
.bmarker.brt { background:#2f81f7; color:#fff; }
.bmarker.nearest-bus { background:var(--green); border-color:#fff; }
.origin-dot { width:18px; height:18px; border-radius:50%; background:var(--blue); border:3px solid #fff; box-shadow:0 0 0 5px rgba(56,189,248,.3), 0 2px 8px rgba(0,0,0,.4); }
.dest-dot { width:22px; height:22px; border-radius:50%; background:var(--red); border:3px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; font-size:.7rem; font-weight:700; color:#fff; }
</style>
</head>
<body>

<div id="side">
<div class="topbar">
  <div class="logo">RIO</div>
  <div class="topbar-info">
    <div class="topbar-title" id="title-txt">Ônibus ao vivo</div>
    <div class="topbar-sub" id="sub-txt">Carregando dados...</div>
  </div>
  <span id="counter">--</span>
  <div class="dot wait" id="sdot"></div>
</div>

<div class="search-bar" id="search-bar">
  <div class="search-top" id="search-top">
    <span id="search-sum">Origem, destino e filtro de linhas</span>
    <span class="pt" id="search-arrow">▾</span>
  </div>
  <div class="search-row">
    <div class="field-wrap">
      <div class="field-icon orig">A</div>
      <input id="orig-input" type="text" placeholder="Partindo de... (endereço, bairro, lugar)" autocomplete="off">
      <button type="button" class="fav-btn" id="orig-fav" aria-label="Favoritar origem">☆</button>
      <div class="ac-drop" id="orig-drop"></div>
    </div>
    <button class="btn-gps" id="btn-swap" type="button" title="Inverter origem e destino" aria-label="Inverter origem e destino">⇅</button>
    <button class="btn-gps" id="btn-gps">&#9679; GPS</button>
  </div>
  <div class="search-row">
    <div class="field-wrap">
      <div class="field-icon dest">B</div>
      <input id="dest-input" type="text" placeholder="Destino... (endereço, bairro, lugar)" autocomplete="off">
      <button type="button" class="fav-btn" id="dest-fav" aria-label="Favoritar destino">☆</button>
      <div class="ac-drop" id="dest-drop"></div>
    </div>
    <button class="btn-ir" id="btn-tracar">Traçar</button>
  </div>
  <div class="search-row">
    <div class="field-wrap">
      <div class="field-icon line">LN</div>
      <input id="line-input" type="text" placeholder="Filtrar linhas (ex: 298, 413) — vazio = ônibus perto de você" autocomplete="off">
    </div>
  </div>
  <div class="lin-loc" id="lin-loc">
    <button class="btn-ir" id="btn-lin-loc" type="button">📍 Usar minha localização atual</button>
    <span id="lin-loc-sub">Mostra as linhas que passam perto de você, nos dois sentidos</span>
  </div>
</div>

<div class="tabs" id="tabs">
  <button type="button" class="on" data-tab="dir">Direções</button>
  <button type="button" data-tab="lin">Linhas</button>
  <button type="button" data-tab="rec">Recorrentes</button>
</div>

<div class="panel" id="panel">
  <div class="panel-head" id="panel-head">
    <span class="pt" id="panel-arrow">▾</span>
    <span id="panel-title">Ônibus mais próximos</span>
    <span id="panel-sum"></span>
    <a class="gm-link" id="gm-link" target="_blank" rel="noopener" hidden>Rotas no Google Maps</a>
  </div>
  <div id="panel-body">
    <div id="chips" class="chips" hidden></div>
    <div id="bus-list"><div class="empty">Defina a origem (GPS, endereço ou toque no mapa) para ver os ônibus perto de você.</div></div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>
<div id="map"></div>

<script src="planner.js"></script>
<script>
// ───────── Config ─────────
var DATA_URL = 'https://raw.githubusercontent.com/kamilomsantos/acompanha_onibus/dados/gps.json';
var NOM_URL  = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&countrycodes=br&addressdetails=1&viewbox=-43.8,-22.7,-43.0,-23.1&q=';
var WORKER_URL = 'https://acompanha-onibus.kamilo-santos.workers.dev/';   // Worker do Cloudflare; se falhar, usa o gps.json
var REFRESH  = 60000;
var RAIO_PERTO_KM = 1.5;
var CENTER   = [-22.9068, -43.1729];
var MAX_MARKERS = 200;

// ───────── Estado ─────────
var map, originMk, destMk, busLayer;
var originLL = null, destLL = null;
var dirty = { orig: false, dest: false };
var buses = [], prevPos = {}, dataUpdated = null, apiErrorState = false;
var filterLines = [];
var tripData = null, tripPlan = [], planActive = false, tripSel = -1, tripLayer = null, planBusy = false;

// ───────── Utilidades ─────────
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function normLine(s) { return String(s).toUpperCase().replace(/\s+/g, ''); }
function hav(la1, lo1, la2, lo2) {
  var R = 6371, d1 = (la2-la1)*Math.PI/180, d2 = (lo2-lo1)*Math.PI/180;
  var a = Math.sin(d1/2)*Math.sin(d1/2) + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(d2/2)*Math.sin(d2/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function fmtDist(km) { return km < 1 ? Math.round(km*1000)+' m' : km.toFixed(1)+' km'; }
// A API devolve hora do Rio com "Z" falso; interpretar como UTC-3.
function rioMs(s) { return Date.parse(String(s).replace(' ', 'T').replace('Z', '') + '-03:00'); }
function ageMin(s) { var t = rioMs(s); return isNaN(t) ? null : Math.max(0, Math.round((Date.now() - t) / 60000)); }

var toastTimer = null;
function showToast(msg, type, ms) {
  var el = $('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type || 'warn');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove('show'); }, ms || 4000);
}
function setStatus(cls, title, sub) {
  $('sdot').className = 'dot ' + cls;
  if (title) $('title-txt').textContent = title;
  if (sub !== undefined) $('sub-txt').textContent = sub;
}

// ───────── Mapa ─────────
map = L.map('map').setView(CENTER, 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
busLayer = L.layerGroup().addTo(map);
tripLayer = L.layerGroup().addTo(map);
map.on('click', function(e) {
  setOrigem(e.latlng.lat, e.latlng.lng, 'ponto no mapa');
  $('orig-input').value = 'Ponto no mapa'; dirty.orig = false;
});

function mkIcon(html, w, h) { return L.divIcon({ className:'', html:html, iconSize:[w,h], iconAnchor:[w/2,h/2] }); }

function setOrigem(lat, lng, label) {
  planActive = false; tripLayer.clearLayers();
  originLL = { lat:lat, lng:lng };
  if (originMk) map.removeLayer(originMk);
  originMk = L.marker([lat,lng], { icon: mkIcon('<div class="origin-dot"></div>',18,18), zIndexOffset:2000, draggable:true })
    .addTo(map).bindTooltip('Origem — ' + label, { direction:'top' })
    .on('dragend', function(e) { pontoAjustado('orig', e.target.getLatLng()); });
  render(); updateGmaps(); atualizarEstrelas();
}
function setDestino(lat, lng, label) {
  planActive = false; tripLayer.clearLayers();
  destLL = { lat:lat, lng:lng };
  if (destMk) map.removeLayer(destMk);
  destMk = L.marker([lat,lng], { icon: mkIcon('<div class="dest-dot">B</div>',22,22), zIndexOffset:2000, draggable:true })
    .addTo(map).bindTooltip('Destino — ' + label, { direction:'top' })
    .on('dragend', function(e) { pontoAjustado('dest', e.target.getLatLng()); });
  if (originLL) map.fitBounds([[originLL.lat,originLL.lng],[lat,lng]], { padding:[60,60] });
  else map.setView([lat,lng], 15);
  render(); updateGmaps(); atualizarEstrelas();
}

function updateGmaps() {
  var a = $('gm-link');
  if (!originLL && !destLL) { a.hidden = true; return; }
  a.hidden = false;
  a.href = 'https://www.google.com/maps/dir/?api=1&travelmode=transit'
    + (originLL ? '&origin=' + originLL.lat + ',' + originLL.lng : '')
    + (destLL ? '&destination=' + destLL.lat + ',' + destLL.lng : '');
}

// ───────── Autocomplete (Nominatim) ─────────
var acTimers = {}, acActive = { orig:-1, dest:-1 };

function setupAc(name, onSelect) {
  var inp = $(name + '-input'), drop = $(name + '-drop');
  inp.addEventListener('focus', function() { if (inp.value.trim().length < 3) mostrarSalvos(name, drop, inp, onSelect); });
  inp.addEventListener('click', function() { if (inp.value.trim().length < 3) mostrarSalvos(name, drop, inp, onSelect); });
  inp.addEventListener('input', function() {
    dirty[name] = true;
    atualizarEstrelas();
    clearTimeout(acTimers[name]);
    var q = inp.value.trim();
    if (q.length < 3) { if (!q) mostrarSalvos(name, drop, inp, onSelect); else drop.classList.remove('open'); return; }
    drop.innerHTML = '<div class="ac-msg">Buscando...</div>';
    drop.classList.add('open');
    acTimers[name] = setTimeout(function() { fetchSuggest(q, drop, inp, name, onSelect); }, 450);
  });
  inp.addEventListener('keydown', function(e) {
    var items = drop.querySelectorAll('.ac-item');
    if (e.key === 'Escape') { drop.classList.remove('open'); return; }
    if (!items.length) { if (e.key === 'Enter' && name === 'dest') tracarRota(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); acActive[name] = Math.min(acActive[name]+1, items.length-1); hl(items, acActive[name]); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); acActive[name] = Math.max(acActive[name]-1, 0); hl(items, acActive[name]); }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[acActive[name]]) items[acActive[name]].click(); else if (name === 'dest') tracarRota(); }
  });
  inp.addEventListener('blur', function() { setTimeout(function() { drop.classList.remove('open'); }, 200); });
}
function hl(items, idx) {
  items.forEach(function(el, i) { el.classList.toggle('active', i === idx); });
  if (items[idx]) items[idx].scrollIntoView({ block:'nearest' });
}

// Número da casa digitado no fim do endereço ("Rua X, 147", "Av. Y 500", "Rua Z, nº 12, Bairro").
function extrairNumero(t) {
  var m = String(t).match(/(?:^|[\s,])(?:n[ºo°.]*\s*)?(\d{1,5}[A-Za-z]?)(?=\s*(?:,|$))/i);
  return m ? m[1] : '';
}
// O mapa (OpenStreetMap) muitas vezes só tem a rua, sem o número: nesse caso o ponto é aproximado.
function numeroAproximado(item, num) {
  return !!num && item.class === 'highway' && !(item.address && item.address.house_number);
}
var AVISO_NUMERO = function(num) { return 'O número ' + num + ' não está no mapa: usei a rua. Arraste o ponto no mapa (ou toque nele) para ajustar.'; };

// Ponto movido à mão no mapa (arrastar o marcador A ou B).
function pontoAjustado(tipo, ll) {
  var estavaAtivo = planActive;
  if (tipo === 'orig') originLL = { lat: ll.lat, lng: ll.lng }; else destLL = { lat: ll.lat, lng: ll.lng };
  dirty[tipo] = false;
  lembrar(tipo, $(tipo + '-input').value, ll.lat, ll.lng);
  atualizarEstrelas(); updateGmaps();
  showToast('📍 Ponto ' + (tipo === 'orig' ? 'A' : 'B') + ' ajustado no mapa', 'ok', 2500);
  if (estavaAtivo && originLL && destLL) tracarRota(); else render();
}

// ───────── Numeração de portas (base oficial da Prefeitura do Rio, ArcGIS público) ─────────
var ARC = 'https://pgeo3.rio.rj.gov.br/arcgis/rest/services/CadLog/';
var AVISO_VIZINHAS = function(num) { return 'O número ' + num + ' foi estimado pelas portas vizinhas. Arraste o ponto no mapa para ajustar.'; };
var cachePorta = {};

function arcQuery(servico, params) {
  var qs = Object.keys(params).map(function(k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(ARC + servico + '/FeatureServer/0/query?' + qs + '&f=json')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j) { if (j.error) throw new Error('arcgis'); return j.features || []; });
}
function sqlTxt(s) { return String(s).replace(/'/g, "''"); }

// Procura o número da porta na rua. Devolve {lat, lng, tipo: 'exato'|'vizinhas', cep} ou null.
function portaOficial(rua, num, ref) {
  var n = parseInt(num, 10);
  if (!n || !rua) return Promise.resolve(null);
  var chave = rua + '|' + n;
  if (cachePorta[chave] !== undefined) return Promise.resolve(cachePorta[chave]);
  return arcQuery('Trechos_Logradouros', { where: "UPPER(completo)='" + sqlTxt(rua.toUpperCase()) + "'", outFields: 'cl', returnGeometry: 'false', resultRecordCount: 50 })
    .then(function(tr) {
      var cls = [];
      tr.forEach(function(f) { if (cls.indexOf(f.attributes.cl) < 0) cls.push(f.attributes.cl); });
      if (!cls.length) return null;
      var lista = cls.slice(0, 8).map(function(c) { return "'" + sqlTxt(c) + "'"; }).join(',');
      return arcQuery('Numero_de_porta', { where: 'cl IN (' + lista + ') AND np_int>=' + (n - 30) + ' AND np_int<=' + (n + 30),
        outFields: 'np_int,cl,cep', returnGeometry: 'true', outSR: 4326, resultRecordCount: 400 })
        .then(function(ps) {
          var pts = ps.filter(function(f) { return f.geometry; })
            .map(function(f) { return { n: f.attributes.np_int, cl: f.attributes.cl, cep: f.attributes.cep, lat: f.geometry.y, lng: f.geometry.x }; });
          if (!pts.length) return null;
          function dist(p) { return ref ? Planner.hav(ref.lat, ref.lng, p.lat, p.lng) : 0; }
          var exatos = pts.filter(function(p) { return p.n === n; }).sort(function(a, b) { return dist(a) - dist(b); });
          if (exatos.length) return { lat: exatos[0].lat, lng: exatos[0].lng, tipo: 'exato', cep: exatos[0].cep };
          // sem a porta exata: usa a rua mais perto do ponto de referência e interpola entre as portas vizinhas do mesmo lado
          var maisPerto = pts.slice().sort(function(a, b) { return dist(a) - dist(b); })[0];
          var lado = pts.filter(function(p) { return p.cl === maisPerto.cl && p.n % 2 === n % 2; });
          var lo = null, hi = null;
          lado.forEach(function(p) {
            if (p.n < n && (!lo || p.n > lo.n)) lo = p;
            if (p.n > n && (!hi || p.n < hi.n)) hi = p;
          });
          if (lo && hi) {
            var f = (n - lo.n) / (hi.n - lo.n);
            return { lat: lo.lat + (hi.lat - lo.lat) * f, lng: lo.lng + (hi.lng - lo.lng) * f, tipo: 'vizinhas', cep: lo.cep };
          }
          var um = lo || hi;
          return um ? { lat: um.lat, lng: um.lng, tipo: 'vizinhas', cep: um.cep } : null;
        });
    })
    .then(function(r) { cachePorta[chave] = r; return r; });
}

function fetchSuggest(q, drop, inp, name, onSelect) {
  acActive[name] = -1;
  var num = extrairNumero(q);
  fetch(NOM_URL + encodeURIComponent(q + ', Rio de Janeiro'))
    .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(data) {
      var rua = null;
      if (num) data.forEach(function(it) { if (!rua && it.class === 'highway' && it.address && it.address.road) rua = it; });
      var oficial = rua
        ? portaOficial(rua.address.road, num, { lat: parseFloat(rua.lat), lng: parseFloat(rua.lon) }).catch(function() { return null; })
        : Promise.resolve(null);
      return oficial.then(function(of) { montarSugestoes(drop, inp, name, onSelect, data, num, rua, of); });
    })
    .catch(function() {
      drop.innerHTML = '<div class="ac-msg">Não foi possível buscar sugestões agora.</div>';
    });
}

function montarSugestoes(drop, inp, name, onSelect, data, num, rua, of) {
  drop.innerHTML = '';
  var opcoes = [];
  if (of && rua) {
    var a0 = rua.address, bairro0 = a0.suburb || a0.neighbourhood || '';
    opcoes.push({
      main: a0.road + ', ' + num, icon: '🏠', lat: of.lat, lon: of.lng, suburb: bairro0,
      sub: [bairro0, a0.city_district, a0.city || 'Rio de Janeiro'].filter(Boolean).join(', ')
        + (of.tipo === 'exato' ? ' · ✓ número localizado (base da Prefeitura)' : ' · nº ' + num + ' estimado pelas portas vizinhas'),
      aviso: of.tipo === 'exato' ? '' : AVISO_VIZINHAS(num)
    });
  }
  data.forEach(function(item) {
    var ad = item.address || {};
    if (of && rua && item.class === 'highway' && ad.road === rua.address.road) return;
    var main = ad.road || ad.amenity || ad.shop || ad.suburb || ad.neighbourhood || item.display_name.split(',')[0];
    var sub = [ad.suburb || ad.neighbourhood, ad.city_district, ad.city || 'Rio de Janeiro'].filter(Boolean).join(', ');
    var aprox = numeroAproximado(item, num);
    if (item.class === 'highway' && num) main = main + ', ' + num;
    if (aprox) sub += ' · nº ' + num + ' aproximado (só a rua está no mapa)';
    opcoes.push({ main: main, sub: sub, icon: placeIcon(item.type || item.class), lat: parseFloat(item.lat), lon: parseFloat(item.lon),
      suburb: ad.suburb, aviso: aprox ? AVISO_NUMERO(num) : '' });
  });
  if (!opcoes.length) { drop.innerHTML = '<div class="ac-msg">Nenhum resultado</div>'; return; }
  opcoes.forEach(function(o) {
    var div = document.createElement('div'); div.className = 'ac-item';
    var ic = document.createElement('span'); ic.className = 'ac-icon'; ic.textContent = o.icon;
    var box = document.createElement('div');
    var m = document.createElement('div'); m.className = 'ac-main'; m.textContent = o.main;
    var s = document.createElement('div'); s.className = 'ac-sub'; s.textContent = o.sub;
    box.appendChild(m); box.appendChild(s); div.appendChild(ic); div.appendChild(box);
    div.addEventListener('mousedown', function(e) { e.preventDefault(); });
    div.addEventListener('click', function() {
      inp.value = o.main + (o.suburb ? ', ' + o.suburb : '');
      dirty[name] = false;
      drop.classList.remove('open');
      onSelect(o.lat, o.lon, o.main);
      lembrar(name, inp.value, o.lat, o.lon);
      if (o.aviso) showToast(o.aviso, 'warn', 8000);
    });
    drop.appendChild(div);
  });
}

// ───────── Favoritos e últimos locais (guardados no aparelho) ─────────
var LS = { fav: 'onibus.fav', orig: 'onibus.rec.orig', dest: 'onibus.rec.dest' };
function lsGet(k) { try { var v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function mesmoLocal(a, b) { return Math.abs(a.lat - b.lat) < 0.0003 && Math.abs(a.lng - b.lng) < 0.0003; }

function lembrar(tipo, nome, lat, lng) {
  nome = String(nome || '').trim();
  if (!nome) return;
  var p = { lat: lat, lng: lng };
  var l = lsGet(LS[tipo]).filter(function(x) { return !mesmoLocal(x, p); });
  l.unshift({ nome: nome, lat: lat, lng: lng });
  lsSet(LS[tipo], l.slice(0, 3));
}
function ehFavorito(p) { return lsGet(LS.fav).some(function(x) { return mesmoLocal(x, p); }); }

function alternarFavorito(tipo) {
  var p = tipo === 'orig' ? originLL : destLL, nome = $(tipo + '-input').value.trim();
  if (!p || dirty[tipo] || !nome || nome.indexOf('Minha localização') === 0 || nome === 'Ponto no mapa') {
    showToast('Escolha um local da lista (ou digite e toque em Traçar) antes de favoritar.', 'warn', 3500);
    return;
  }
  var f = lsGet(LS.fav), i = -1;
  f.forEach(function(x, k) { if (mesmoLocal(x, p)) i = k; });
  if (i >= 0) { f.splice(i, 1); showToast('Removido dos favoritos', 'ok', 1800); }
  else { f.unshift({ nome: nome, lat: p.lat, lng: p.lng }); showToast('★ Salvo nos favoritos', 'ok', 1800); }
  lsSet(LS.fav, f.slice(0, 20));
  atualizarEstrelas();
}
function atualizarEstrelas() {
  ['orig', 'dest'].forEach(function(t) {
    var p = t === 'orig' ? originLL : destLL, b = $(t + '-fav');
    var on = !!(p && !dirty[t] && ehFavorito(p));
    b.textContent = on ? '★' : '☆';
    b.classList.toggle('on', on);
  });
}
$('orig-fav').addEventListener('click', function() { alternarFavorito('orig'); });
$('dest-fav').addEventListener('click', function() { alternarFavorito('dest'); });

function mostrarSalvos(tipo, drop, inp, onSelect) {
  var favs = lsGet(LS.fav), rec = lsGet(LS[tipo]).filter(function(r) { return !favs.some(function(f) { return mesmoLocal(f, r); }); });
  if (!favs.length && !rec.length) { drop.classList.remove('open'); return; }
  drop.innerHTML = '';
  function cabecalho(txt) { var h = document.createElement('div'); h.className = 'ac-head'; h.textContent = txt; drop.appendChild(h); }
  function item(x, ehFav, idx) {
    var div = document.createElement('div'); div.className = 'ac-item';
    var ic = document.createElement('span'); ic.className = 'ac-icon'; ic.textContent = ehFav ? '★' : '🕘';
    var m = document.createElement('div'); m.className = 'ac-main'; m.textContent = x.nome;
    div.appendChild(ic); div.appendChild(m);
    if (ehFav) {
      var rm = document.createElement('span'); rm.className = 'ac-x'; rm.textContent = '×'; rm.title = 'Remover dos favoritos';
      rm.addEventListener('mousedown', function(e) { e.preventDefault(); e.stopPropagation(); });
      rm.addEventListener('click', function(e) {
        e.stopPropagation();
        var f = lsGet(LS.fav); f.splice(idx, 1); lsSet(LS.fav, f);
        atualizarEstrelas();
        mostrarSalvos(tipo, drop, inp, onSelect);
      });
      div.appendChild(rm);
    }
    div.addEventListener('mousedown', function(e) { e.preventDefault(); });
    div.addEventListener('click', function() {
      inp.value = x.nome; dirty[tipo] = false;
      drop.classList.remove('open');
      onSelect(x.lat, x.lng, x.nome);
      lembrar(tipo, x.nome, x.lat, x.lng);
    });
    drop.appendChild(div);
  }
  if (favs.length) { cabecalho('Favoritos'); favs.forEach(function(x, i) { item(x, true, i); }); }
  if (rec.length) { cabecalho(tipo === 'orig' ? 'Últimos embarques' : 'Últimos destinos'); rec.forEach(function(x) { item(x, false); }); }
  drop.classList.add('open');
}

function placeIcon(type) {
  var icons = { bus:'🚌', subway:'🚇', station:'🚆', train:'🚆', hospital:'🏥', school:'🏫', university:'🎓', park:'🌳', beach:'🏖️', stadium:'🏟️',
    mall:'🛍️', supermarket:'🛒', restaurant:'🍽️', cafe:'☕', hotel:'🏨', fuel:'⛽', museum:'🏛️', church:'⛪', bank:'🏦' };
  var t = String(type || '').toLowerCase();
  for (var k in icons) if (t.indexOf(k) >= 0) return icons[k];
  return '📍';
}

setupAc('orig', function(lat, lng, label) { setOrigem(lat, lng, label); map.setView([lat,lng], 15); });
setupAc('dest', function(lat, lng, label) { setDestino(lat, lng, label); });

// ───────── GPS e botão Traçar ─────────
$('btn-gps').addEventListener('click', function() {
  if (!navigator.geolocation) { showToast('Seu navegador não suporta localização. Digite a origem.', 'error', 6000); return; }
  setStatus('wait', null, 'Obtendo sua localização...');
  navigator.geolocation.getCurrentPosition(function(pos) {
    setOrigem(pos.coords.latitude, pos.coords.longitude, 'GPS');
    map.setView([pos.coords.latitude, pos.coords.longitude], 15);
    $('orig-input').value = 'Minha localização (GPS)'; dirty.orig = false;
    showToast('📍 Localização obtida', 'ok', 2500);
    showFreshness();
  }, function(err) {
    var msgs = { 1:'🔒 Permissão de localização negada. Digite a origem ou toque no mapa.',
                 2:'📡 Posição indisponível. Digite a origem ou toque no mapa.',
                 3:'⏱ Tempo esgotado ao obter o GPS. Digite a origem ou toque no mapa.' };
    showToast(msgs[err.code] || 'Erro ao obter localização.', 'error', 6000);
    showFreshness();
  }, { enableHighAccuracy:true, timeout:12000, maximumAge:30000 });
});

function geocode(text, cb) {
  return fetch(NOM_URL + encodeURIComponent(text + ', Rio de Janeiro'))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.length) { showToast('Local não encontrado: ' + text, 'warn', 4000); return; }
      var it = d[0], num = extrairNumero(text), lat = parseFloat(it.lat), lng = parseFloat(it.lon);
      var oficial = (num && it.class === 'highway' && it.address && it.address.road)
        ? portaOficial(it.address.road, num, { lat: lat, lng: lng }).catch(function() { return null; })
        : Promise.resolve(null);
      return oficial.then(function(of) {
        if (of) {
          cb(of.lat, of.lng, it.address.road + ', ' + num);
          if (of.tipo !== 'exato') showToast(AVISO_VIZINHAS(num), 'warn', 8000);
          return;
        }
        cb(lat, lng, it.display_name.split(',')[0]);
        if (numeroAproximado(it, num)) showToast(AVISO_NUMERO(num), 'warn', 8000);
      });
    });
}
function tracarRota() {
  if (planBusy) return;
  var o = $('orig-input').value.trim(), d = $('dest-input').value.trim(), tasks = [];
  planBusy = true;
  $('btn-tracar').textContent = 'Buscando...';
  if (o && dirty.orig) tasks.push(geocode(o, function(la, ln, lb) { dirty.orig = false; setOrigem(la, ln, lb); lembrar('orig', o, la, ln); }));
  if (d && dirty.dest) tasks.push(geocode(d, function(la, ln, lb) { dirty.dest = false; setDestino(la, ln, lb); lembrar('dest', d, la, ln); }));
  Promise.all(tasks)
    .then(function() {
      if (!originLL || !destLL) { showToast('Defina a origem (A) e o destino (B) para ver as viagens.', 'warn', 4000); return; }
      // cada clique busca de novo os dados dos ônibus
      return Promise.all([carregar(true), ensureLinhas()]).then(function() {
        if (!tripData) return;
        planActive = true;
        if (tab !== 'dir') setTab('dir');
        calcularViagens(true);
        salvarRota();
        updateGmaps();
        map.fitBounds([[originLL.lat, originLL.lng], [destLL.lat, destLL.lng]], { padding:[60,60] });
      });
    })
    .catch(function() { showToast('Não foi possível buscar agora. Verifique a internet.', 'error', 5000); })
    .then(function() { planBusy = false; $('btn-tracar').textContent = 'Traçar'; });
}
$('btn-tracar').addEventListener('click', tracarRota);

// Inverte origem e destino (campos, pontos no mapa e favoritos) e refaz a busca se já havia viagens traçadas.
function inverter() {
  var oi = $('orig-input'), di = $('dest-input');
  var a = originLL, b = destLL, da = dirty.orig, db = dirty.dest, ta = oi.value, tb = di.value;
  var tinhaPlano = planActive;
  oi.value = tb; di.value = ta;
  if (originMk) { map.removeLayer(originMk); originMk = null; }
  if (destMk) { map.removeLayer(destMk); destMk = null; }
  originLL = null; destLL = null;
  if (b) setOrigem(b.lat, b.lng, tb);
  if (a) setDestino(a.lat, a.lng, ta);
  dirty.orig = db; dirty.dest = da;
  atualizarEstrelas();
  if (tinhaPlano && originLL && destLL) tracarRota();
  else { render(); updateGmaps(); }
}
$('btn-swap').addEventListener('click', inverter);

// ───────── Viagens (traçados oficiais GTFS + ônibus ao vivo) ─────────
function ensureLinhas() {
  if (tripData) return Promise.resolve();
  showToast('Carregando traçados das linhas...', 'warn', 3000);
  return fetch('linhas.json')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j) { tripData = j; $('toast').classList.remove('show'); })
    .catch(function() { showToast('Não foi possível carregar os traçados das linhas.', 'error', 6000); });
}

function hhmm(d) { return d.toLocaleTimeString('pt-BR', { timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit' }); }

var RAIO_EMBARQUE_M = 200, nPerto = 0;
var tripSelKey = null, baldPlan = [], baldSel = -1, baldSelKey = null;
function tripKey(t) { return t.svc + '|' + t.dir; }

// novo = true: cálculo iniciado pelo usuário (Traçar ou mudança do filtro); false: atualização automática
function calcularViagens(novo) {
  if (!tripData || !originLL || !destLL) return;
  var agora = Date.now();
  // 1) linhas com parada a até 200 m de A; 2) demais opções com caminhada maior
  var perto = Planner.plan(tripData, buses, originLL, destLL, agora, { maxWalkA: RAIO_EMBARQUE_M, maxWalkB: 800 });
  var vistas = {};
  perto.forEach(function(t) { vistas[tripKey(t)] = true; });
  var longe = Planner.plan(tripData, buses, originLL, destLL, agora, { maxWalkA: 800, maxWalkB: 800 })
    .filter(function(t) { return !vistas[tripKey(t)] && t.walkAm > RAIO_EMBARQUE_M; });
  nPerto = perto.length;
  tripPlan = perto.concat(longe);
  if (filterLines.length) {
    tripPlan = tripPlan.filter(function(t) { return filterLines.indexOf(normLine(t.svc)) >= 0; });
    nPerto = tripPlan.filter(function(t) { return t.walkAm <= RAIO_EMBARQUE_M; }).length;
  }
  // baldeação: só quando não há linha direta, ou quando ela poupa 10 min ou mais
  baldPlan = [];
  if (!filterLines.length) {
    try {
      var melhorDireta = tripPlan.length ? tripPlan[0].total : 1e9;
      baldPlan = Planner.planBaldeacao(tripData, buses, originLL, destLL, agora, {})
        .filter(function(b) { return b.total < melhorDireta - 10; });
    } catch (e) { baldPlan = []; }
  }
  baldSel = -1;
  if (baldSelKey) baldPlan.forEach(function(b, i) { if (b.key === baldSelKey) baldSel = i; });
  if (baldSel >= 0) tripSelKey = null;
  if (novo) tripSelKey = (filterLines.length && tripPlan.length) ? tripKey(tripPlan[0]) : null;
  tripSel = -1;
  if (tripSelKey) tripPlan.forEach(function(t, i) { if (tripKey(t) === tripSelKey) tripSel = i; });
  renderTrips();
  if (novo && tripSel < 0) baldSelKey = null;
  if (novo && tripSel >= 0) {
    if (celular()) $('panel').classList.add('min');
    setTimeout(function() { map.invalidateSize(); selectTrip(tripSel, true); }, 90);
  }
}

function renderTrips() {
  var list = $('bus-list');
  $('chips').hidden = true;
  busLayer.clearLayers();
  $('panel-title').textContent = 'Viagens de A para B';
  $('counter').textContent = tripPlan.length + (tripPlan.length === 1 ? ' linha' : ' linhas') + (baldPlan.length ? ' + ' + baldPlan.length + ' c/ baldeação' : '');
  list.innerHTML = '';
  var note = document.createElement('div'); note.className = 'tnote';
  note.textContent = 'Atualizado às ' + hhmm(new Date()) + ' · dados dos ônibus de ' + String(dataUpdated || '').slice(11, 16)
    + ' · estimativa pela grade horária das linhas (linhas diretas; baldeação só quando não há direta ou poupa 10 min ou mais). No mapa: azul = sua viagem, vermelho tracejado = ônibus até o ponto de embarque, pontilhado preto = trecho a pé.';
  list.appendChild(note);
  var idade = dataUpdated ? Math.round((Date.now() - Planner.rioMs(dataUpdated)) / 60000) : null;
  if (idade !== null && idade > 15) {
    var aviso = document.createElement('div'); aviso.className = 'tnote'; aviso.style.color = 'var(--red)';
    aviso.textContent = '⚠️ Os dados dos ônibus estão com ' + idade + ' min de atraso (a coleta automática ainda não atualizou). A estimativa pode estar errada.';
    list.appendChild(aviso);
  }
  if (!tripPlan.length && !baldPlan.length) {
    var e = document.createElement('div'); e.className = 'empty';
    e.textContent = !buses.length ? 'Sem dados dos ônibus no momento.'
      : filterLines.length ? 'A linha ' + filterLines.join(', ') + ' não tem ônibus a caminho de A para B agora (ou não passa perto dos dois pontos). Apague o filtro de linhas para ver as outras.'
      : 'Nenhuma linha direta nem com uma baldeação, com ônibus a caminho, entre A e B agora. Toque em "Rotas no Google Maps" para outras opções.';
    list.appendChild(e);
    tripLayer.clearLayers();
    updatePanelSum();
    return;
  }
  if (tripPlan.length) renderTripGroups(list);
  renderBaldeacoes(list);
  if (tripSel >= 0) selectTrip(tripSel, false); else if (baldSel >= 0) selectBald(baldSel, false); else tripLayer.clearLayers();
  updatePanelSum();
}

function tripCard(t, i) {
  var div = document.createElement('div'); div.className = 'trip' + (i === tripSel ? ' sel' : '');
  div.innerHTML = '<div class="trip-top"><span class="tline' + (t.modal === 'B' ? ' brt' : '') + '">' + esc(t.svc) + '</span><span class="thead">→ ' + esc(t.head) + '</span>'
    + '<span class="ttot"><b>' + t.total + ' min</b> · chega às ' + hhmm(t.arrive) + '</span></div>'
    + '<div class="tsub">Ônibus chega ao ponto em <b>' + t.waits.join(', ') + ' min</b></div>'
    + '<div class="tsub">Desça em ' + esc(t.stopB) + ' <span>(' + t.walkBm + ' m até B)</span> · viagem ~' + t.ride + ' min</div>';
  div.addEventListener('click', function() {
    tripSel = i; tripSelKey = tripKey(t); baldSel = -1; baldSelKey = null;
    if (celular()) $('panel').classList.add('min');
    renderTrips();
    setTimeout(function() { map.invalidateSize(); selectTrip(i, true); }, 90);
  });
  return div;
}

// Agrupa por parada de embarque (na ordem da melhor opção) e separa as linhas da mesma parada com "ou".
function renderTripGroups(list) {
  function secao(titulo, ini, fim, maxGrupos) {
    var grupos = [], porParada = {};
    for (var i = ini; i < fim; i++) {
      var t = tripPlan[i];
      if (!porParada[t.stopA]) { porParada[t.stopA] = { stop: t.stopA, walk: t.walkAm, itens: [] }; grupos.push(porParada[t.stopA]); }
      porParada[t.stopA].itens.push({ t: t, i: i });
    }
    if (!grupos.length) return;
    var h = document.createElement('div'); h.className = 'tsec'; h.textContent = titulo; list.appendChild(h);
    grupos.slice(0, maxGrupos).forEach(function(g) {
      var cab = document.createElement('div'); cab.className = 'tgroup';
      cab.innerHTML = '<span class="tstop">🚏 ' + esc(g.stop) + '</span><span class="twalk">' + g.walk + ' m a pé · '
        + g.itens.length + (g.itens.length === 1 ? ' linha' : ' linhas') + '</span>';
      list.appendChild(cab);
      g.itens.forEach(function(it, k) {
        if (k > 0) { var ou = document.createElement('div'); ou.className = 'tsep'; ou.textContent = 'ou'; list.appendChild(ou); }
        list.appendChild(tripCard(it.t, it.i));
      });
    });
  }
  if (nPerto > 0) secao('Embarque a até ' + RAIO_EMBARQUE_M + ' m da localização', 0, nPerto, 6);
  else {
    var aviso = document.createElement('div'); aviso.className = 'tnote'; aviso.style.color = 'var(--yellow)';
    aviso.textContent = 'Nenhuma linha com parada a até ' + RAIO_EMBARQUE_M + ' m da localização leva até B agora. Estas são opções com caminhada maior.';
    list.appendChild(aviso);
  }
  secao(nPerto > 0 ? 'Mais opções (paradas mais distantes)' : 'Opções com paradas mais distantes', nPerto, tripPlan.length, 4);
}

// Trecho a pé: pontilhado preto (com contorno branco para aparecer sobre o mapa)
function walkLine(de, para) {
  if (!de || !para) return;
  var pts = [[de[0], de[1]], [para[0], para[1]]];
  tripLayer.addLayer(L.polyline(pts, { color:'#FFFFFF', weight:6, opacity:.85, lineCap:'round' }));
  tripLayer.addLayer(L.polyline(pts, { color:'#000000', weight:3, opacity:1, dashArray:'1 7', lineCap:'round' }));
}

function legHTML(L1, tipo) {
  return '<span class="tline' + (L1.modal === 'B' ? ' brt' : '') + '">' + esc(L1.svc) + '</span> ';
}

function baldCard(b, i) {
  var div = document.createElement('div'); div.className = 'trip' + (i === baldSel ? ' sel' : '');
  div.innerHTML = '<div class="trip-top">' + legHTML(b.x) + '<span class="thead">→ baldeação →</span> ' + legHTML(b.y)
    + '<span class="ttot"><b>' + b.total + ' min</b> · chega às ' + hhmm(b.arrive) + '</span></div>'
    + '<div class="tsub">1) Embarque em ' + esc(b.x.stopA) + ' (' + b.x.walkAm + ' m a pé): ônibus ' + esc(b.x.svc) + ' chega em <b>' + b.x.waits.join(', ') + ' min</b> · ~' + b.x.ride + ' min de viagem</div>'
    + '<div class="tsub">2) Desça em ' + esc(b.x.stopT) + (b.walkT > 30 ? ' e caminhe ' + b.walkT + ' m até ' + esc(b.y.stopT) : '') + ' · espera ~' + b.esperaT + ' min pelo ' + esc(b.y.svc) + (b.est ? ' (estimado: sem ônibus previsto nessa hora)' : '') + '</div>'
    + '<div class="tsub">3) Desça em ' + esc(b.y.stopB) + ' <span>(' + b.y.walkBm + ' m até B)</span> · viagem ~' + b.y.ride + ' min</div>';
  div.addEventListener('click', function() {
    baldSel = i; baldSelKey = b.key; tripSel = -1; tripSelKey = null;
    if (celular()) $('panel').classList.add('min');
    renderTrips();
    setTimeout(function() { map.invalidateSize(); selectBald(i, true); }, 90);
  });
  return div;
}

function renderBaldeacoes(list) {
  if (!baldPlan.length) return;
  var h = document.createElement('div'); h.className = 'tsec';
  h.textContent = tripPlan.length ? 'Com uma baldeação (mais rápidas que as diretas)' : 'Com uma baldeação (não há linha direta)';
  list.appendChild(h);
  baldPlan.forEach(function(b, i) { list.appendChild(baldCard(b, i)); });
}

function selectBald(i, fit) {
  var b = baldPlan[i];
  tripLayer.clearLayers();
  if (!b) return;
  var shX = tripData.shapes[b.x.sid], shY = tripData.shapes[b.y.sid];
  var p1 = Planner.slice(shX, b.x.stopAll.along, b.x.stopTll.along), p2 = Planner.slice(shY, b.y.stopTll.along, b.y.stopBll.along);
  if (p1.length > 1) tripLayer.addLayer(L.polyline(p1, { color:'#38BDF8', weight:5, opacity:.85 }));
  if (p2.length > 1) tripLayer.addLayer(L.polyline(p2, { color:'#A78BFA', weight:5, opacity:.9 }));
  function pt(id, cor, txt) { var s = tripData.stops[id]; tripLayer.addLayer(L.marker([s[1], s[2]], { icon: mkIcon('<div class="stopmk" style="background:' + cor + '"></div>', 14, 14) }).bindTooltip(txt + ': ' + s[0])); }
  pt(b.x.stopAll.i, '#22C55E', 'Embarque'); pt(b.x.stopTll.i, '#FACC15', 'Troca (desça do ' + b.x.svc + ')'); pt(b.y.stopTll.i, '#FACC15', 'Troca (suba no ' + b.y.svc + ')'); pt(b.y.stopBll.i, '#F87171', 'Desembarque');
  var saLL = tripData.stops[b.x.stopAll.i], tLL = tripData.stops[b.y.stopTll.i], xtLL = tripData.stops[b.x.stopTll.i], sbLL = tripData.stops[b.y.stopBll.i];
  walkLine([originLL.lat, originLL.lng], [saLL[1], saLL[2]]); walkLine([xtLL[1], xtLL[2]], [tLL[1], tLL[2]]); walkLine([sbLL[1], sbLL[2]], [destLL.lat, destLL.lng]);
  var all = p1.concat(p2, drawApproach(shX, b.x.stopAll.along, [saLL[1], saLL[2]], b.x.buses, b.x.svc), drawApproach(shY, b.y.stopTll.along, [tLL[1], tLL[2]], b.y.buses.slice(0, 1), b.y.svc));
  if (fit && all.length) map.fitBounds(L.latLngBounds(all), { padding:[50,50], maxZoom:16 });
}

function selectTrip(i, fit) {
  var t = tripPlan[i];
  tripLayer.clearLayers();
  if (!t) return;
  var sh = tripData.shapes[t.sid];
  var pts = Planner.slice(sh, t.stopAll.along, t.stopBll.along);
  if (pts.length > 1) tripLayer.addLayer(L.polyline(pts, { color:'#38BDF8', weight:5, opacity:.85 }));
  var sa = tripData.stops[t.stopAll.i], sb = tripData.stops[t.stopBll.i];
  tripLayer.addLayer(L.marker([sa[1], sa[2]], { icon: mkIcon('<div class="stopmk" style="background:#22C55E"></div>', 14, 14) }).bindTooltip('Embarque: ' + sa[0]));
  tripLayer.addLayer(L.marker([sb[1], sb[2]], { icon: mkIcon('<div class="stopmk" style="background:#F87171"></div>', 14, 14) }).bindTooltip('Desembarque: ' + sb[0]));
  walkLine([originLL.lat, originLL.lng], [sa[1], sa[2]]); walkLine([sb[1], sb[2]], [destLL.lat, destLL.lng]);
  var all = pts.concat(drawApproach(sh, t.stopAll.along, [sa[1], sa[2]], t.buses, t.svc));
  if (fit && all.length) map.fitBounds(L.latLngBounds(all), { padding:[50,50], maxZoom:16 });
}

// Tracejado laranja do(s) ônibus até o ponto + marcador "🚌 linha · N min". Devolve os pontos do ônibus mais próximo (para enquadrar o mapa).
// Do ônibus mais perto do ponto para o mais longe; cada trecho vai só até o ônibus da frente (sem sobreposição).
function drawApproach(sh, stopAlong, stopLL, busesArr, svc) {
  var ord = busesArr.slice().sort(function(a, b) { return b.along - a.along; });
  var prevAlong = stopAlong, prevLL = stopLL, fitPts = [];
  ord.forEach(function(x, k) {
    var seg = Planner.slice(sh, x.along, prevAlong);
    seg.unshift([x.b.lat, x.b.lng]);
    seg.push(prevLL);
    tripLayer.addLayer(L.polyline(seg, { color:'#FFFFFF', weight:10, opacity: k === 0 ? .9 : .6, lineCap:'round' }));
    tripLayer.addLayer(L.polyline(seg, { color:'#E11D48', weight:6, opacity: k === 0 ? 1 : .8, dashArray:'12 10', lineCap:'butt' }));
    if (k === 0) fitPts = seg.slice();
    prevAlong = x.along; prevLL = [x.b.lat, x.b.lng];
  });
  ord.forEach(function(x) {
    var min = Math.max(1, Math.round(x.w));
    tripLayer.addLayer(L.marker([x.b.lat, x.b.lng], { icon: mkIcon('<div class="waitmk">🚌 ' + esc(svc) + ' · ' + min + ' min</div>', 92, 24), zIndexOffset: 900 })
      .bindTooltip('Linha ' + svc + ' · ' + x.b.id + ' · chega ao ponto em ' + min + ' min'));
  });
  return fitPts;
}

// ───────── Aba Linhas (todas as linhas com parada perto do ponto) ─────────
var tab = 'dir', linhaSelKey = null, linhasList = [];

function setTab(nome) {
  tab = nome;
  $('search-bar').classList.toggle('modo-lin', nome === 'lin');
  if (nome !== 'lin') esconderLocMk();
  [].forEach.call(document.querySelectorAll('#tabs button'), function(b) { b.classList.toggle('on', b.getAttribute('data-tab') === nome); });
  tripLayer.clearLayers();
  linhaSelKey = null;
  $('panel').classList.remove('min');
  if (nome === 'lin') ensureLinhas().then(function() { if (!locAtual) pedirLocalizacao(); else { mostrarLocMk(); renderLinhas(); } });
  else if (nome === 'rec') renderRecorrentes();
  else if (planActive) renderTrips();
  else render();
}
document.querySelectorAll('#tabs button').forEach(function(b) {
  b.addEventListener('click', function() { setTab(b.getAttribute('data-tab')); });
});

// ───────── Aba Recorrentes (últimas 3 rotas A → B) ─────────
LS.rotas = 'onibus.rotas';

function salvarRota() {
  var a = $('orig-input').value.trim(), b = $('dest-input').value.trim();
  if (!originLL || !destLL || !a || !b) return;
  if (a.indexOf('Minha localização') === 0 || a === 'Ponto no mapa') return;
  var r = { a: { nome: a, lat: originLL.lat, lng: originLL.lng }, b: { nome: b, lat: destLL.lat, lng: destLL.lng } };
  var l = lsGet(LS.rotas).filter(function(x) { return !(mesmoLocal(x.a, r.a) && mesmoLocal(x.b, r.b)); });
  l.unshift(r);
  lsSet(LS.rotas, l.slice(0, 3));
}

function usarRota(r) {
  $('orig-input').value = r.a.nome; dirty.orig = false; setOrigem(r.a.lat, r.a.lng, r.a.nome);
  $('dest-input').value = r.b.nome; dirty.dest = false; setDestino(r.b.lat, r.b.lng, r.b.nome);
  setTab('dir');
  tracarRota();
}

function renderRecorrentes() {
  var list = $('bus-list'), rotas = lsGet(LS.rotas);
  $('chips').hidden = true;
  busLayer.clearLayers(); tripLayer.clearLayers();
  $('panel-title').textContent = 'Rotas recorrentes';
  $('counter').textContent = rotas.length + (rotas.length === 1 ? ' rota' : ' rotas');
  $('panel-sum').textContent = ''; $('panel').classList.remove('has-sum');
  list.innerHTML = '';
  if (!rotas.length) {
    list.innerHTML = '<div class="empty">As últimas 3 rotas que você traçar aparecem aqui. Toque numa delas para buscar de novo.</div>';
    return;
  }
  var note = document.createElement('div'); note.className = 'tnote';
  note.textContent = 'Últimas rotas traçadas. Toque para buscar de novo com os ônibus de agora.';
  list.appendChild(note);
  rotas.forEach(function(r, i) {
    var div = document.createElement('div'); div.className = 'rrow';
    var txt = document.createElement('div'); txt.className = 'rr-txt';
    [['A', r.a.nome, '#38BDF8', '#000'], ['B', r.b.nome, '#F87171', '#fff']].forEach(function(x) {
      var ln = document.createElement('div'); ln.className = 'rr-line';
      var dot = document.createElement('span'); dot.className = 'rr-dot'; dot.textContent = x[0]; dot.style.background = x[2]; dot.style.color = x[3];
      var nm = document.createElement('span'); nm.className = 'rr-nome'; nm.textContent = x[1];
      ln.appendChild(dot); ln.appendChild(nm); txt.appendChild(ln);
    });
    var rm = document.createElement('span'); rm.className = 'ac-x'; rm.textContent = '×'; rm.title = 'Remover esta rota';
    rm.addEventListener('click', function(e) {
      e.stopPropagation();
      var l = lsGet(LS.rotas); l.splice(i, 1); lsSet(LS.rotas, l);
      renderRecorrentes();
    });
    div.appendChild(txt); div.appendChild(rm);
    div.addEventListener('click', function() { usarRota(r); });
    list.appendChild(div);
  });
}

var locAtual = null, locMk = null, locBusy = false;

function mostrarLocMk() {
  if (!locAtual || locMk) return;
  locMk = L.marker([locAtual.lat, locAtual.lng], { icon: mkIcon('<div class="origin-dot"></div>', 18, 18), zIndexOffset: 2000 })
    .addTo(map).bindTooltip('Você está aqui', { direction:'top' });
}
function esconderLocMk() { if (locMk) { map.removeLayer(locMk); locMk = null; } }

function pedirLocalizacao() {
  if (locBusy) return;
  if (!navigator.geolocation) { showToast('Seu navegador não suporta localização.', 'error', 5000); return; }
  locBusy = true;
  $('lin-loc-sub').textContent = 'Obtendo sua localização...';
  if (tab === 'lin') renderLinhas();
  navigator.geolocation.getCurrentPosition(function(pos) {
    locBusy = false;
    locAtual = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    esconderLocMk();
    $('lin-loc-sub').textContent = 'Localização atual obtida';
    if (tab === 'lin') { mostrarLocMk(); map.setView([locAtual.lat, locAtual.lng], 16); renderLinhas(); }
  }, function(err) {
    locBusy = false;
    var msgs = { 1:'🔒 Permissão de localização negada. Libere o acesso à localização no navegador.',
                 2:'📡 Posição indisponível agora.', 3:'⏱ Tempo esgotado ao obter o GPS.' };
    showToast(msgs[err.code] || 'Erro ao obter localização.', 'error', 6000);
    $('lin-loc-sub').textContent = 'Localização indisponível';
    if (tab === 'lin') renderLinhas();
  }, { enableHighAccuracy:true, timeout:12000, maximumAge:30000 });
}
$('btn-lin-loc').addEventListener('click', function() { locAtual = null; pedirLocalizacao(); });

// Linhas que passam perto da localização atual, nos dois sentidos (a parada mais perto de cada sentido).
function renderLinhas() {
  var list = $('bus-list');
  $('chips').hidden = true;
  busLayer.clearLayers();
  $('panel-title').textContent = 'Linhas perto de você';
  var ref = locAtual;
  if (!ref) {
    $('counter').textContent = '--';
    list.innerHTML = '<div class="empty">' + (locBusy ? 'Obtendo sua localização...'
      : 'Toque em “Usar minha localização atual” para ver as linhas que passam perto de você, nos dois sentidos.') + '</div>';
    updatePanelSum();
    return;
  }
  if (!tripData) { list.innerHTML = '<div class="empty">Carregando traçados das linhas...</div>'; return; }
  mostrarLocMk();
  linhasList = Planner.linhasNoPonto(tripData, buses, ref, Date.now());

  var porLinha = {}, linhas = [];
  linhasList.forEach(function(l) {
    if (!porLinha[l.svc]) { porLinha[l.svc] = { svc: l.svc, itens: [] }; linhas.push(porLinha[l.svc]); }
    porLinha[l.svc].itens.push(l);
  });
  linhas.forEach(function(g) {
    g.itens.sort(function(a, b) { return a.dir - b.dir; });
    g.dist = Math.min.apply(null, g.itens.filter(function(x) { return !x.longe; }).map(function(x) { return x.dist; }));
    g.perto = g.dist <= RAIO_EMBARQUE_M;
  });
  linhas.sort(function(a, b) { return (b.perto - a.perto) || (a.dist - b.dist); });
  $('counter').textContent = linhas.length + (linhas.length === 1 ? ' linha' : ' linhas');
  list.innerHTML = '';

  // mapa: círculo de 200 m e as paradas (verde = até 200 m, cinza = mais longe) com o nº de linhas
  var paradas = {};
  linhasList.forEach(function(l) {
    var k = l.stopLL[0] + ',' + l.stopLL[1];
    if (!paradas[k]) paradas[k] = { nome: l.stop, ll: l.stopLL, dist: l.dist, svcs: [] };
    if (paradas[k].svcs.indexOf(l.svc) < 0) paradas[k].svcs.push(l.svc);
  });
  busLayer.addLayer(L.circle([ref.lat, ref.lng], { radius: RAIO_EMBARQUE_M, color:'#22C55E', weight:1.5, dashArray:'6 6', fillOpacity:.05 }));
  Object.keys(paradas).forEach(function(k) {
    var g = paradas[k], perto = g.dist <= RAIO_EMBARQUE_M;
    busLayer.addLayer(L.marker(g.ll, { icon: mkIcon('<div class="stopcnt' + (perto ? ' perto' : '') + '">' + g.svcs.length + '</div>', 24, 24), zIndexOffset: perto ? 700 : 600 })
      .bindTooltip(g.nome + ' · ' + g.dist + ' m · linhas: ' + g.svcs.join(', ')));
  });

  var note = document.createElement('div'); note.className = 'tnote';
  note.textContent = 'Linhas com parada a até 500 m da sua localização · dados de ' + String(dataUpdated || '').slice(11, 16)
    + ' · cada linha mostra os dois sentidos (a parada mais perto de cada um) · tempos pela grade horária (estimativa).';
  list.appendChild(note);
  if (!linhas.length) {
    var e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'Nenhuma linha tem parada a até 500 m da sua localização.';
    list.appendChild(e);
    updatePanelSum();
    return;
  }
  if (!linhas.some(function(g) { return g.perto; })) {
    var av = document.createElement('div'); av.className = 'tnote'; av.style.color = 'var(--yellow)';
    av.textContent = 'Nenhuma linha tem parada a até ' + RAIO_EMBARQUE_M + ' m de você. Mostrando as mais próximas.';
    list.appendChild(av);
  }

  var selItem = null, secaoAtual = null;
  linhas.slice(0, 60).forEach(function(g) {
    var nomeSecao = g.perto ? '✓ Passam por onde você está (até ' + RAIO_EMBARQUE_M + ' m)' : 'Mais próximas (até 500 m)';
    if (nomeSecao !== secaoAtual) {
      secaoAtual = nomeSecao;
      var h = document.createElement('div'); h.className = 'tsec' + (g.perto ? ' ok' : ''); h.textContent = nomeSecao; list.appendChild(h);
    }
    var cab = document.createElement('div'); cab.className = 'tgroup' + (g.perto ? ' ponto' : '');
    cab.innerHTML = '<span class="tstop"><span class="tline' + (g.itens[0].modal === 'B' ? ' brt' : '') + '">' + esc(g.svc) + '</span> ' + g.itens.map(function(x) { return esc(x.head); }).join(' ⇄ ') + '</span>'
      + (g.perto ? '<span class="badge b-aprox">no ponto</span>' : '');
    list.appendChild(cab);
    g.itens.forEach(function(l) {
      var key = l.svc + '|' + l.dir, sel = key === linhaSelKey;
      if (sel) selItem = l;
      var div = document.createElement('div'); div.className = 'lrow' + (sel ? ' sel' : '');
      var quando = l.waits.length ? '<span class="ttot">em ' + l.waits[0] + ' min</span>'
        : '<span class="ttot off">' + (l.emCirculacao ? 'nenhum ônibus a caminho' : 'sem ônibus agora') + '</span>';
      div.innerHTML = '<div class="trip-top"><span class="thead lsent">Sentido <b>' + esc(l.head) + '</b></span>' + quando + '</div>'
        + '<div class="tsub">🚏 ' + esc(l.stop) + ' · ' + l.dist + ' m a pé' + (l.longe ? ' <span style="color:var(--yellow)">(parada mais distante)</span>' : '')
        + (l.waits.length > 1 ? ' · depois <b>' + l.waits.slice(1).join(', ') + ' min</b>' : '') + '</div>';
      div.addEventListener('click', function() {
        linhaSelKey = key;
        if (celular()) $('panel').classList.add('min');
        renderLinhas();
        setTimeout(function() { map.invalidateSize(); desenharLinha(l, true); }, 90);
      });
      list.appendChild(div);
    });
  });
  if (selItem) desenharLinha(selItem, false); else tripLayer.clearLayers();
  var panelSum = $('panel-sum'), p = $('panel');
  if (selItem) { panelSum.textContent = selItem.svc + ' → sentido ' + selItem.head + (selItem.waits.length ? ' · em ' + selItem.waits[0] + ' min' : ''); p.classList.add('has-sum'); }
  else p.classList.remove('has-sum');
}

function desenharLinha(l, fit) {
  tripLayer.clearLayers();
  var sh = tripData.shapes[l.sid];
  Planner.prep(sh);
  var pts = [];
  for (var i = 0; i < sh.n; i++) pts.push([sh.p[2 * i], sh.p[2 * i + 1]]);
  tripLayer.addLayer(L.polyline(pts, { color:'#38BDF8', weight:4, opacity:.6 }));
  tripLayer.addLayer(L.marker(l.stopLL, { icon: mkIcon('<div class="stopmk" style="background:#22C55E"></div>', 14, 14) }).bindTooltip('Parada: ' + l.stop));
  var fp = drawApproach(sh, l.stopAll.along, l.stopLL, l.buses, l.svc);
  if (fit) {
    var all = fp.length ? fp : [l.stopLL];
    map.fitBounds(L.latLngBounds(all), { padding:[60,60], maxZoom:16 });
  }
}

// ───────── Minimizar painéis ─────────
function refazerMapa() { setTimeout(function() { map.invalidateSize(); }, 80); }
function celular() { return window.matchMedia('(max-width: 799px)').matches; }

$('panel-head').addEventListener('click', function(e) {
  if (e.target.closest('a')) return;
  $('panel').classList.toggle('min');
  refazerMapa();
});

function updateSearchSum() {
  var min = $('search-bar').classList.contains('min'), el = $('search-sum');
  var o = $('orig-input').value.trim(), d = $('dest-input').value.trim();
  el.textContent = (min && (o || d)) ? 'A: ' + (o || '—') + '  →  B: ' + (d || '—') : 'Origem, destino e filtro de linhas';
}
$('search-top').addEventListener('click', function() {
  $('search-bar').classList.toggle('min');
  updateSearchSum();
  refazerMapa();
});

function updatePanelSum() {
  var p = $('panel'), t = (planActive && tripSel >= 0) ? tripPlan[tripSel] : null;
  if (t) { $('panel-sum').textContent = t.svc + ' → ' + t.head + ' · ' + t.total + ' min · chega às ' + hhmm(t.arrive); p.classList.add('has-sum'); }
  else if (planActive && baldSel >= 0 && baldPlan[baldSel]) { var bb = baldPlan[baldSel]; $('panel-sum').textContent = bb.x.svc + ' + ' + bb.y.svc + ' (baldeação) · ' + bb.total + ' min · chega às ' + hhmm(bb.arrive); p.classList.add('has-sum'); }
  else if (planActive) { $('panel-sum').textContent = tripPlan.length + (tripPlan.length === 1 ? ' linha' : ' linhas') + ' de A para B' + (baldPlan.length ? ' + ' + baldPlan.length + ' com baldeação' : ''); p.classList.add('has-sum'); }
  else p.classList.remove('has-sum');
}

// ───────── Filtro de linhas ─────────
$('line-input').addEventListener('input', function() {
  filterLines = this.value.split(/[\s,;]+/).map(normLine).filter(Boolean);
  if (tab === 'lin') { renderLinhas(); return; }
  if (planActive) { calcularViagens(true); return; }
  render();
});

// ───────── Render ─────────
function referencia() { return originLL || destLL; }

function render() {
  if (tab === 'lin') { renderLinhas(); return; }
  if (tab === 'rec') { renderRecorrentes(); return; }
  if (planActive) { renderTrips(); return; }
  tripLayer.clearLayers();
  updatePanelSum();
  var ref = referencia();
  var list = $('bus-list'), chips = $('chips');

  buses.forEach(function(b) { b._d = ref ? hav(ref.lat, ref.lng, b.lat, b.lng) : null; });

  var visiveis;
  if (filterLines.length) visiveis = buses.filter(function(b) { return filterLines.indexOf(normLine(b.s)) >= 0; });
  else if (ref) visiveis = buses.filter(function(b) { return b._d <= RAIO_PERTO_KM; });
  else visiveis = [];

  visiveis.sort(function(a, c) { return (a._d === null ? 0 : a._d) - (c._d === null ? 0 : c._d); });

  // Linhas que passam perto (chips)
  chips.hidden = true;
  if (ref && !filterLines.length) {
    var perto = {}, pertoB = {};
    buses.forEach(function(b) {
      if (b._d !== null && b._d <= 0.8) { if (!(b.s in perto) || b._d < perto[b.s]) perto[b.s] = b._d; }
      if (destLL && originLL && hav(destLL.lat, destLL.lng, b.lat, b.lng) <= 0.8) pertoB[b.s] = true;
    });
    var ls = Object.keys(perto).sort(function(x, y) { return perto[x] - perto[y]; }).slice(0, 14);
    if (ls.length) {
      chips.hidden = false;
      chips.innerHTML = '<div class="chips-label">Linhas com ônibus a até 800 m de ' + (originLL ? 'A' : 'B')
        + (destLL && originLL ? ' · <span style="color:var(--green)">verde = também há ônibus perto de B (estimativa)</span>' : '') + ' — toque para filtrar</div>';
      ls.forEach(function(s) {
        var c = document.createElement('span');
        c.className = 'chip' + (pertoB[s] ? ' both' : '');
        c.textContent = s;
        c.addEventListener('click', function() { $('line-input').value = s; filterLines = [normLine(s)]; render(); });
        chips.appendChild(c);
      });
    }
  }

  // Marcadores
  busLayer.clearLayers();
  visiveis.slice(0, MAX_MARKERS).forEach(function(b, i) {
    var near = ref && i === 0;
    var mk = L.marker([b.lat, b.lng], { icon: mkIcon('<div class="bmarker' + (b.m === 'B' ? ' brt' : '') + (near ? ' nearest-bus' : '') + '">' + esc(b.s) + '</div>', 40, 24), zIndexOffset: near ? 900 : 500 });
    var age = ageMin(b.t);
    mk.bindPopup('<b>Linha ' + esc(b.s) + '</b> · ' + esc(b.id) + '<br>' + b.v + ' km/h' + (age !== null ? '<br>posição de ' + age + ' min atrás' : ''));
    busLayer.addLayer(mk);
  });

  $('counter').textContent = (filterLines.length || ref) ? visiveis.length + ' ônibus' : buses.length + ' no Rio';
  $('panel-title').textContent = filterLines.length ? 'Linha ' + filterLines.join(', ') : 'Ônibus mais próximos';

  // Lista
  if (!buses.length) { list.innerHTML = '<div class="empty">Aguardando dados dos ônibus...</div>'; return; }
  if (!filterLines.length && !ref) { list.innerHTML = '<div class="empty">Defina a origem (GPS, endereço ou toque no mapa) para ver os ônibus perto de você, ou digite uma linha no filtro.</div>'; return; }
  if (!visiveis.length) {
    list.innerHTML = '<div class="empty">' + (filterLines.length ? 'Nenhum ônibus em circulação nessa linha agora.' : 'Nenhum ônibus a até ' + RAIO_PERTO_KM + ' km de você agora.') + '</div>';
    return;
  }
  var html = '';
  visiveis.slice(0, 12).forEach(function(b, i) {
    var dTxt = b._d !== null ? fmtDist(b._d) : '';
    var prev = prevPos[b.id], approach = false, away = false;
    if (b._d !== null && prev && ref) {
      var pd = hav(ref.lat, ref.lng, prev.lat, prev.lng);
      approach = b._d < pd - 0.03; away = b._d > pd + 0.03;
    }
    var eta = (approach && b.v >= 3 && b._d !== null) ? ' · ~' + Math.max(1, Math.round(b._d / b.v * 60)) + ' min' : '';
    var dir = approach ? 'Aproximando' + eta : (away ? 'Afastando' : (b.d === 'I' ? 'Sentido ida' : b.d === 'V' ? 'Sentido volta' : 'Em circulação'));
    var badge = approach ? '<span class="badge b-aprox">aprox.</span>' : (away ? '<span class="badge b-longe">afastando</span>' : '');
    var age = ageMin(b.t);
    html += '<div class="brow' + (i === 0 && ref ? ' nearest' : '') + '">'
      + '<div><div class="bline">' + esc(b.s) + '</div><div class="bid">' + esc(b.id) + '</div></div>'
      + '<div><div class="bdist">' + esc(dTxt) + ' ' + badge + '</div><div class="bdir">' + esc(dir) + '</div></div>'
      + '<div><div class="bspd">' + b.v + ' km/h</div><div class="bage">' + (age !== null ? age + ' min' : '') + '</div></div>'
      + '</div>';
  });
  list.innerHTML = html;
}

// ───────── Dados ─────────
function showFreshness() {
  if (!dataUpdated) return;
  var t = rioMs(dataUpdated), min = isNaN(t) ? null : Math.round((Date.now() - t) / 60000);
  var hora = String(dataUpdated).slice(11, 16);
  var cls = min === null ? 'wait' : (min <= 12 ? 'live' : (min <= 30 ? 'wait' : 'err'));
  setStatus(cls, 'Ônibus ao vivo', 'Dados de ' + hora + (min !== null ? ' (há ' + min + ' min)' : '') + ' · SMTR/Rio');
}

// 1ª opção: Worker do Cloudflare (repassa a SMTR com CORS e cache de 30 s; o celular consolida). Reserva: gps.json do GitHub Actions.
function buscarSppo(forcar) {
  var t = forcar ? Date.now() : Math.floor(Date.now() / 30000);
  var doWorker = WORKER_URL
    ? fetch(WORKER_URL + (WORKER_URL.indexOf('?') < 0 ? '?' : '&') + 't=' + t, { cache: 'no-store' })
        .then(function(r) { if (!r.ok) throw new Error('worker ' + r.status); return r.json(); })
        .then(function(arr) { if (!Array.isArray(arr) || arr.length < 100) throw new Error('worker sem dados'); return Planner.consolidar(arr); })
    : Promise.reject(new Error('sem worker'));
  return doWorker.catch(function() {
    return fetch(DATA_URL + '?t=' + (forcar ? Date.now() : Math.floor(Date.now() / 60000)), { cache: 'no-store' })
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  });
}

// BRT: opcional; se falhar, segue só com os ônibus
function buscarBrt() {
  if (!WORKER_URL) return Promise.resolve([]);
  return fetch(WORKER_URL.replace(/\/+$/, '') + '/brt?t=' + Math.floor(Date.now() / 30000), { cache: 'no-store' })
    .then(function(r) { if (!r.ok) throw new Error('brt ' + r.status); return r.json(); })
    .then(function(j) { return Planner.consolidarBRT(j, Date.now()); })
    .catch(function() { return []; });
}

function buscarDados(forcar) {
  return Promise.all([buscarSppo(forcar), buscarBrt()]).then(function(r) {
    var j = r[0];
    if (r[1].length) j = Object.assign({}, j, { buses: (j.buses || []).concat(r[1]) });
    return j;
  });
}

function carregar(forcar) {
  return buscarDados(forcar)
    .then(function(j) {
      var anterior = {};
      buses.forEach(function(b) { anterior[b.id] = { lat: b.lat, lng: b.lng }; });
      prevPos = anterior;
      buses = (j.buses || []).map(function(a) { return { s:String(a[0]), id:String(a[1]), lat:a[2], lng:a[3], v:a[4] || 0, d:a[5], t:a[6], m:a[7] || '' }; });
      dataUpdated = j.updated;
      if (apiErrorState) { apiErrorState = false; showToast('✅ Dados atualizados', 'ok', 2500); }
      showFreshness();
      if (tab === 'lin') renderLinhas(); else if (tab === 'rec') renderRecorrentes(); else if (planActive) calcularViagens(); else render();
    })
    .catch(function(e) {
      var msg;
      if (!navigator.onLine) msg = '📶 Sem internet no aparelho. Atualiza sozinho quando voltar.';
      else if (String(e.message).indexOf('404') >= 0) msg = '⏳ Dados ainda não publicados. O primeiro ciclo leva até 10 min.';
      else msg = '⚠️ Não foi possível carregar os dados (' + e.message + '). Nova tentativa em 1 min.';
      setStatus('err', null, msg.replace(/^\S+\s/, ''));
      if (!apiErrorState) { apiErrorState = true; showToast(msg, 'error', 6000); }
    });
}

carregar();
setInterval(carregar, REFRESH);
window.addEventListener('online', carregar);
</script>
