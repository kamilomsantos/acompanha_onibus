name: Atualizar GPS dos ônibus

on:
  push:
    branches: [master]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gps
  cancel-in-progress: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Coletar GPS da SMTR
        run: node coletar.js gps.json

      - name: Publicar na branch dados (sem histórico)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp gps.json out/
          cd out
          git init -q -b dados
          git config user.name "gps-bot"
          git config user.email "gps-bot@users.noreply.github.com"
          git add gps.json
          git commit -q -m "gps $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" dados
